<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Constancia CURP</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1000px; /* Ajusta según prefieras el tamaño máximo */
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background-color: #fff;
            padding: 10px;
            border-radius: 8px;
        }

        img {
            width: 100%;    /* Ocupa el ancho del contenedor */
            height: auto;   /* Mantiene la proporción para que no se estire */
            display: block;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Referencia al archivo solicitado -->
        <img src="image_8d633f.jpg" alt="Constancia de la Clave Única de Registro de Población">
    </div>

</body>
</html>
